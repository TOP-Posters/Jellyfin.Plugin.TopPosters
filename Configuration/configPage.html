<!DOCTYPE html>
<html>
<head>
    <title>TOP Posters</title>
</head>
<body>
    <div id="TopPostersConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-linkbutton">
        <div data-role="content">
            <div class="content-primary">

                <form id="TopPostersConfigForm">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">TOP Posters</h2>
                    </div>

                    <div class="verticalSection">
                        <p>
                            Don't have an account yet?
                            <a href="https://api.top-streaming.stream/user/register" target="_blank" is="emby-linkbutton">
                                Register at top-streaming.stream
                            </a>
                            — it's free.
                        </p>
                        <p>
                            Customize your posters (language, style, badges, thumbnail settings) from your
                            <a href="https://api.top-streaming.stream/user/dashboard" target="_blank" is="emby-linkbutton">
                                personal dashboard
                            </a>.
                            All preferences are applied automatically via your API key.
                        </p>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="apiKey">API Key</label>
                        <input id="apiKey" name="ApiKey" type="text" is="emby-input"
                               placeholder="TP-xxxxxxxxxxxxxxxx" />
                        <div class="fieldDescription">
                            Find your API key in your
                            <a href="https://api.top-streaming.stream/user/dashboard" target="_blank" is="emby-linkbutton">
                                dashboard
                            </a>
                            under <strong>API Key</strong>.
                        </div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block">
                            <span>Save</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script type="text/javascript">
        var TopPostersConfig = {
            pluginId: "a3f2e1d4-5b6c-7d8e-9f0a-1b2c3d4e5f6a",

            loadConfig: function () {
                ApiClient.getPluginConfiguration(this.pluginId).then(function (config) {
                    document.querySelector('#apiKey').value = config.ApiKey || '';
                });
            },

            saveConfig: function () {
                var self = this;
                ApiClient.getPluginConfiguration(self.pluginId).then(function (config) {
                    config.ApiKey = document.querySelector('#apiKey').value.trim();
                    ApiClient.updatePluginConfiguration(self.pluginId, config).then(function () {
                        Dashboard.processPluginConfigurationUpdateResult();
                    });
                });
            }
        };

        document.querySelector('#TopPostersConfigPage').addEventListener('pageshow', function () {
            TopPostersConfig.loadConfig();
        });

        document.querySelector('#TopPostersConfigForm').addEventListener('submit', function (e) {
            e.preventDefault();
            TopPostersConfig.saveConfig();
        });
    </script>
</body>
</html>
