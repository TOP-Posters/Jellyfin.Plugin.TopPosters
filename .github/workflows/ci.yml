name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build Jellyfin.Plugin.TopPosters.csproj -c Release
      - run: dotnet run --project Tests/TopPosters.Tests.csproj -c Release
      - run: node Tests/settings.test.mjs
